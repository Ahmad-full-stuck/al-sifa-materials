<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>جارٍ فتح الصفحة</title>
    <meta name="robots" content="noindex" />
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8f3ed; color: #2d2222; font-family: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; text-align: center; }
      div { max-width: 420px; }
      h1 { margin: 0 0 10px; font-size: 22px; }
      p { margin: 0 0 18px; color: #6f5e58; font-size: 14px; line-height: 1.9; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 12px 26px; color: #fff; background: #0E6B45; border-radius: 12px; font-size: 14px; font-weight: 700; text-decoration: none; }
    </style>
    <script>
      (function () {
        var known = ['catalog', 'product', 'cart', 'checkout', 'contact', 'about', 'materials-guide', 'tracking', 'policies', 'favorites', 'stats', 'confirmation']
        var segs = location.pathname.split('/').filter(Boolean)
        var base = '/' + (segs[0] || '') + '/'
        var rest = segs.slice(1).join('/')
        var target = location.origin + base
        if (rest && known.indexOf(rest.split('/')[0]) !== -1) target += '#/' + rest
        var link = document.getElementById('go')
        if (link) link.href = target
        location.replace(target)
      })()
    </script>
  </head>
  <body>
    <div>
      <h1>جارٍ فتح الصفحة</h1>
      <p>الرابط الذي فتحته غير موجود، سنعيدك إلى الصفحة الصحيحة تلقائياً.</p>
      <a id="go" href="/">افتح المتجر</a>
    </div>
  </body>
</html>
